<script>
(()=>{
const TK='eh_token',tk=()=>localStorage.getItem(TK),$a=id=>document.getElementById(id),au=$a('auth'),A=window.AUTH={};
async function api(p,b,m){const r=await fetch(p,{method:m||'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tk()||'')},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(r.status===401&&tk()&&p==='/api/save'){localStorage.removeItem(TK);location.reload()}if(!r.ok)throw new Error(j.error||'Cannot reach the server');return j}
let tm=0,last=null;
A.push=s=>{if(!tk())return;last=s;clearTimeout(tm);tm=setTimeout(A.flush,4000)};
A.flush=()=>{if(!last||!tk())return;const s=last;last=null;fetch('/api/save',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk()},body:JSON.stringify({save:s})}).catch(()=>{last=last||s})};
addEventListener('visibilitychange',()=>{if(document.hidden)A.flush()});addEventListener('pagehide',A.flush);
if(tk()){au.style.display='none';document.querySelector('#start .box').insertAdjacentHTML('beforeend','<div style="margin-top:10px;font:10px system-ui;color:#789">'+(localStorage.getItem('eh_email')||'Logged in')+' · <a href="#" id="aOut" style="color:#9cf">Log out</a></div>');
 $a('aOut').onclick=e=>{e.preventDefault();A.flush();localStorage.removeItem(TK);localStorage.removeItem('eh_email');localStorage.removeItem('emberhaven_save');setTimeout(()=>location.reload(),150)}}
let mode='login';const msg=t=>$a('aMsg').textContent=t||'';
function setMode(m){mode=m;msg();document.querySelectorAll('#aTabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$a('aRec').style.display=m==='reset'?'block':'none';$a('aBtn').textContent=m==='login'?'LOGIN':m==='register'?'CREATE ACCOUNT':'SET NEW PASSWORD';$a('aPass').placeholder=m==='reset'?'New password (6+ characters)':'Password (6+ characters)'}
document.querySelectorAll('#aTabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$a('aOff').onclick=()=>{au.style.display='none'};
async function submit(){
 const email=$a('aEmail').value.trim(),password=$a('aPass').value;if(!email||!password)return msg('Fill in email and password.');
 $a('aBtn').disabled=true;msg('...');
 try{const j=await api('/api/'+mode,{email,password,recovery:$a('aRec').value});
  const local=localStorage.getItem('emberhaven_save');
  localStorage.setItem(TK,j.token);localStorage.setItem('eh_email',email.toLowerCase());
  if(j.save)localStorage.setItem('emberhaven_save',JSON.stringify(j.save));
  else if(local){try{await api('/api/save',{save:local})}catch(e){}}
  if(j.recovery){au.querySelector('.box').innerHTML='<h1>SAVE THIS CODE</h1><p>This recovery code is the ONLY way to reset a forgotten password. Screenshot or write it down.</p><div style="font:16px monospace;color:#ffd24d;margin:14px 0;user-select:text;-webkit-user-select:text">'+j.recovery+'</div><button class="pri" id="aOk">I SAVED IT</button>';$a('aOk').onclick=()=>location.reload()}
  else location.reload()}
 catch(e){msg(e.message);$a('aBtn').disabled=false}}
$a('aBtn').onclick=submit;['aEmail','aPass','aRec'].forEach(i=>$a(i).addEventListener('keydown',e=>{if(e.key==='Enter')submit()}));
})();
</script>

function drawMon(g,m){
 if(m.cast&&!m.dead){const R=m.cast.s==='slam'?110:m.cast.s==='nova'?200:70;g.fillStyle='rgba(255,40,40,'+(.12+.1*Math.sin(T*18))+')';g.beginPath();g.ellipse(m.x,m.y,R,R*.5,0,0,7);g.fill();g.strokeStyle='#f44';g.lineWidth=2;g.stroke()}
 if(m.boss){g.save();g.translate(m.x,m.y);g.scale(m.sz,m.sz);g.translate(-m.x,-m.y);g.fillStyle='rgba(255,40,40,'+(.16+.08*Math.sin(T*4))+')';g.beginPath();g.ellipse(m.x,m.y,30,12,0,0,7);g.fill();drawMon0(g,m);g.restore();return}
 drawMon0(g,m)}
const HT={slime:30,goblin:44,wolf:36,bat:40,spider:32,golem:54,ghost:42,skel:48,scorp:34,snake:30,elem:54,drake:44};
function drawMon0(g,m){const sh=m.shape||['slime','goblin','wolf'][m.tier];
 const fl=m.hitT>0,mvk=m.mv,col=fl?'#fff':m.col;
 let ox=0,oy=0;
 if(m.atkA>0){const a=Math.atan2(P.y-m.y,P.x-m.x),k=Math.sin(m.atkA/.25*Math.PI)*7;ox=Math.cos(a)*k;oy=Math.sin(a)*k}
 const hop=sh==='slime'?Math.abs(Math.sin(T*(mvk?7:2.5)+m.x))*(mvk?6:1.5):0;
 g.fillStyle='rgba(0,0,0,'+(.28-hop*.02)+')';g.beginPath();g.ellipse(m.x+ox,m.y+oy,13-hop*.6,5,0,0,7);g.fill();
 g.save();g.translate(ox,oy);
 const X=m.x,Y=m.y,j=sh==='slime'?0:Math.sin(T*(mvk?12:2.2)+m.x)*(mvk?1.5:.8);
 if(sh==='slime'){const sq=Math.sin(T*(mvk?7:2.5)+m.x+1.5)*2.2;
  pellipse(g,X,Y-10-hop,13+sq,11-sq,col);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(X-7,Y-19-hop-sq,6,4);g.fillStyle='#123';g.fillRect(X-6,Y-13-hop,3,4);g.fillRect(X+3,Y-13-hop,3,4)}
 else if(sh==='goblin'){
  const a=mvk?Math.sin(T*12+m.x)*3:0;
  g.fillStyle='#3a5a2a';g.fillRect(X-7,Y-10-Math.max(0,a),5,10);g.fillRect(X+2,Y-10-Math.max(0,-a),5,10);
  g.fillStyle=col;g.fillRect(X-8,Y-22+j,16,14);g.fillRect(X-7,Y-34+j,14,13);g.fillRect(X-13,Y-31+j,6,5);g.fillRect(X+7,Y-31+j,6,5);
  g.fillStyle='#ff4';g.fillRect(X-4,Y-29+j,2,3);g.fillRect(X+2,Y-29+j,2,3);
  const sw=m.atkA>0?-1.4+2.8*(1-m.atkA/.25):Math.sin(T*3+m.x)*.08+(mvk?a*.05:0);
  g.save();g.translate(X+m.dir*10,Y-18+j);g.rotate(sw*m.dir);g.fillStyle='#6b4a2e';g.fillRect(-2,-14,4,20);g.fillStyle='#8a6038';g.fillRect(-4,-18,8,6);g.restore();
 }else if(sh==='wolf'){
  const a=mvk?Math.sin(T*14+m.x)*4:0,lg=shade(col,.75);
  g.fillStyle=lg;g.fillRect(X-16,Y-10-Math.max(0,a),4,10);g.fillRect(X-8,Y-10-Math.max(0,-a),4,10);g.fillRect(X+4,Y-10-Math.max(0,-a),4,10);g.fillRect(X+11,Y-10-Math.max(0,a),4,10);
  const bob=mvk?-Math.abs(Math.sin(T*14+m.x))*2:j,tw=Math.sin(T*8+m.x)*3;
  g.fillStyle=col;g.fillRect(X-18,Y-22+bob,34,14);g.fillRect(X+(m.dir>0?10:-24),Y-28+bob,14,12);g.fillRect(X+(m.dir>0?-24:16),Y-24+bob+tw,8,4);
  g.fillStyle='#6b6b78';g.fillRect(X-18,Y-24+bob,34,4);
  g.fillStyle='#f33';g.fillRect(X+(m.dir>0?18:-18),Y-24+bob,3,3);g.fillStyle='#ddd';g.fillRect(X+(m.dir>0?20:-24),Y-16+bob,3,3)}else drawX(g,m,sh,X,Y,mvk,col,j);
 g.restore();
 if(m.hp<m.max||P.target===m){g.fillStyle='#000';g.fillRect(m.x-16,m.y-HT[sh],32,5);g.fillStyle='#e23b3b';g.fillRect(m.x-15,m.y-HT[sh]+1,30*m.hp/m.max,3);}
 tag(g,`Lv${m.lv} ${m.name}`,m.x,m.y-HT[sh]-6,m.boss?'#ffd24d':m.agro?'#ff8a8a':'#ffe');
}
